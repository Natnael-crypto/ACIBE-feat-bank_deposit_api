version: "2"
sql:
  - schema: "./db/migrations/"
    queries:
      - "./db/query/account"
      - "./db/query/collaborate"
      - "./db/query/department"
      - "./db/query/dashboard"
    engine: "postgresql"
    strict_order_by: false
    gen:
      go:
        package: "dbgen"
        sql_package: "pgx/v5"
        out: "./gen/db"
        emit_exported_queries: true
        emit_json_tags: false
        overrides:
          - db_type: "uuid"
            go_type: "github.com/google/uuid.UUID"
          - db_type: "uuid"
            go_type: "github.com/google/uuid.NullUUID"
            nullable: true
          
